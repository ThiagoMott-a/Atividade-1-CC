<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>
    <header>
        <h1>Cadastro de Voluntarios</h1>
        <img src="Cadastro.jpg" alt="Cadastro" width="200" height="150">
        <nav>
        </nav>
    </header>
    <main>
        <section>
            <h2>Formulário de Cadastro</h2>
            <form action="#" method="post">
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00">
                <label for="dataNascimento">Data de nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required><br>
                <label for="endereco">Endereço:</label><br>
                <input type="text" id="endereco" name="endereco" required><br>              
                <label id="Cidade">Cidade:</label><br>
                <input type="text" id="cidade" name="cidade" required><br>
                <label for="estado">Estado:</label><br>
                <input type="text" id="estado" name="estado" required><br>
                <label for="cep">CEP:</label><br>
                <input type="text" id="cep" maxlength="9" placeholder="00000-000"><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required> <br>

                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" maxlength="15" placeholder="(00) 00000-0000">
                     
                <label for="interesse">Área de Interesse:</label>
                <select id="interesse" name="interesse" required>
                    <option value="" disabled selected>Selecione uma área</option>
                    <option value="educacao">Educação</option>
                    <option value="saude">Saúde</option>
                    <option value="meio_ambiente">Meio Ambiente</option>
                    <option value="outros">Outros</option>
                </select><br><br>

                <input type="submit" value="Cadastrar">
            </form>

            
        </section>
    </main>

    <footer></footer>
        <p>&copy; 2024 ONG Comunidade Carente. Todos os direitos reservados.</p>
</body>
</html>
