<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <h1>Cadastro de Voluntarios</h1>
        <img src="Cadastro.jpg" alt="Cadastro" width="200" height="150">
        <nav>
        </nav>
    </header>
    <main>
        <section>
            <h2>Formulário de Cadastro</h2>
            <form action="#" method="post">
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone" name="telefone" required><br><br>

                <label for="interesse">Área de Interesse:</label><br>
                <select id="interesse" name="interesse" required>
                    <option value="educacao">Educação</option>
                    <option value="saude">Saúde</option>
                    <option value="meio_ambiente">Meio Ambiente</option>
                    <option value="outros">Outros</option>
                </select><br><br>

                <input type="submit" value="Cadastrar">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 ONG Comunidade Carente. Todos os direitos reservados.</p>
</body>
</html>
